{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">

    <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">
        Edit Semester
    </h2>

    <form method="POST" class="space-y-4">

        <div>
            <label class="block text-gray-600 mb-1">
                Semester Number
            </label>

            <input
                type="number"
                name="semester_number"
                value="{{ semester['semester_number'] }}"
                required
                min="1"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            >
        </div>

        <!-- Buttons -->
        <div class="flex justify-between items-center">

            <a href="{{ url_for('semesters.semesters') }}"
               class="text-sm text-gray-500 hover:underline">
                ← Back
            </a>

            <button
                type="submit"
                onclick="return confirm('Update this semester number?')"
                class="bg-warning text-white px-4 py-2 rounded-lg shadow hover:bg-yellow-600 transition"
            >
                Update
            </button>

        </div>

    </form>

</div>

{% endblock %}
