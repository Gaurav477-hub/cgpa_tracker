{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-10">

    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
        Login
    </h2>

    <form method="POST" class="space-y-4">

        <!-- Username -->
        <div>
            <label class="block text-gray-600 mb-1">Username</label>
            <input 
                name="username"
                value="{{ request.form.get('username', '') }}"
                required
                autocomplete="username"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            >
        </div>

        <!-- Password -->
        <div>
            <label class="block text-gray-600 mb-1">Password</label>
            <input 
                type="password"
                name="password"
                required
                autocomplete="current-password"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            >
        </div>

        <!-- Button -->
        <button 
            type="submit"
            class="w-full bg-primary text-white py-2 rounded-lg shadow hover:bg-blue-700 transition"
        >
            Login
        </button>

    </form>

    <!-- Register link -->
    <p class="text-sm text-gray-500 mt-4 text-center">
        Don’t have an account?
        <a href="{{ url_for('auth.register') }}" class="text-primary hover:underline">
            Register here
        </a>
    </p>

</div>

{% endblock %}
