{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">

    <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">
        Add Semester
    </h2>

    <form method="POST" class="space-y-4">

        <div>
            <label class="block text-gray-600 mb-1">
                Semester Number
            </label>

            <input 
                type="number" 
                name="semester_number"
                value="{{ request.form.get('semester_number', '') }}"
                required
                min="1"
                class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            >
        </div>

        <button 
            type="submit"
            class="w-full bg-success text-white py-2 rounded-lg shadow hover:bg-green-700 transition"
        >
            Add Semester
        </button>

    </form>

    <p class="text-sm text-gray-500 mt-4 text-center">
        <a href="{{ url_for('semesters.semesters') }}" class="text-primary hover:underline">
            ← Back to Semesters
        </a>
    </p>

</div>

{% endblock %}
